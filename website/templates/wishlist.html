{% extends "layout.html" %}
{% block body %}
<h1>Wishlist</h1>
<!-- Grid for the wishlist products to go in -->
<div class="wishlist-grid">
<!-- Loop to display every wishlist product and its image -->
{% for product in database %}
    <!-- Card for the wishlist products to go in -->
    <div class="wishlist-card">
        <img src="{{ product[4] }}" alt="{{ product[2] }}">
        <div class="wishlist-card-text">
            <b>{{ product[2] }}</b>
            <p>${{ "%.2f" | format(product[3] | float) }}</p>
        </div>
        <div class="wishlist-card-buttons">
            <!-- Add to Cart Form -->
            <form action="{{ url_for('add_to_cart') }}" method="POST" style="display: inline;">
                <input type="hidden" name="product_id" value="{{ product[0] }}">
                <input type="hidden" name="url" value="{{ request.path }}">
                <button type="submit">Add to Cart</button>
            </form>
            <br>

            <!-- Remove from Wishlist Form -->
            <form action="{{ url_for('remove_from_wishlist') }}" method="POST" style="display: inline;">
                <input type="hidden" name="product_id" value="{{ product[0] }}">
                <button type="submit" class="remove">Remove</button>
            </form>
        </div>
    </div>
{% endfor %}
</div>
{% endblock %}
